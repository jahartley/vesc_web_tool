<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WRSM Telemetry & Tuning Workstation</title>
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-main);
            padding: 20px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
        }

        h1 { font-size: 1.5rem; font-weight: 700; color: var(--text-main); }
        .tagline { font-size: 0.85rem; color: var(--text-muted); }

        .dashboard {
            display: grid;
            grid-template-columns: 320px 1fr;
            grid-template-rows: 1fr 250px;
            gap: 15px;
            flex-grow: 1;
            margin-top: 15px;
            min-height: 0;
        }

        /* Sidebar / Control Card styles */
        .sidebar {
            grid-row: 1 / span 2;
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto;
        }

        .card {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .card-title {
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 6px;
        }

        label { font-size: 0.8rem; color: var(--text-muted); display: block; margin-bottom: 4px; }
        select, input, button {
            width: 100%;
            padding: 8px 12px;
            background-color: var(--bg-primary);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 4px;
            font-size: 0.85rem;
            outline: none;
        }

        button {
            cursor: pointer;
            font-weight: 600;
            background-color: var(--accent-blue);
            border: none;
            transition: opacity 0.1s;
        }
        button:hover { opacity: 0.9; }
        button.disconnect { background-color: var(--accent-red); }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        .stat-box {
            background-color: var(--bg-primary);
            padding: 8px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            text-align: center;
        }
        .stat-val { font-size: 1.1rem; font-weight: 700; font-family: monospace; }

        /* Canvas Plotter Area */
        .plot-container {
            grid-column: 2;
            grid-row: 1;
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            position: relative;
            min-height: 0;
        }

        .canvas-wrapper {
            flex-grow: 1;
            position: relative;
            width: 100%;
            min-height: 0; /* Crucial: allows flex child to shrink */
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            background-color: #0b0f19;
            border-radius: 4px;
            border: 1px solid var(--border-color);
        }

        /* Var Toggles */
        .plot-selectors {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
            max-height: 80px;
            overflow-y: auto;
            padding: 5px;
            background: var(--bg-primary);
            border-radius: 4px;
        }
        .selector-tag {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.75rem;
            background: var(--bg-secondary);
            padding: 4px 8px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            cursor: pointer;
        }
        .selector-tag input { width: auto; cursor: pointer; }

        /* Terminal Console */
        .terminal-container {
            grid-column: 2;
            grid-row: 2;
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-height: 0;
        }

        .console-out {
            flex-grow: 1;
            background-color: #020617;
            font-family: "Courier New", Courier, monospace;
            font-size: 0.85rem;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            overflow-y: auto;
            white-space: pre-wrap;
            color: #22c55e;
        }

        .console-input-row {
            display: flex;
            gap: 10px;
        }
        .console-input-row input { flex-grow: 1; }
        .console-input-row button { width: auto; padding: 0 20px; }
    </style>
</head>
<body>

    <header>
        <div>
            <h1>WRSM Diagnostics</h1>
            <span class="tagline">50Hz IEEE-754 Compact Binary Telemetry Framework</span>
        </div>
        <div style="font-size: 0.85rem; color: var(--accent-green);" id="stream-indicator">● IDLE</div>
    </header>

    <div class="dashboard">
        
        <!-- SIDEBAR CONTROLS -->
        <div class="sidebar">
            
            <!-- Connection Card -->
            <div class="card">
                <div class="card-title">Serial Connection</div>
                <div>
                    <label>Baud Rate</label>
                    <select id="baudrate">
                        <option value="115200" selected>115200 (Default VESC USB)</option>
                        <option value="921600">921600 (High-Speed Serial)</option>
                    </select>
                </div>
                <button id="btn-connect">Connect Port</button>
            </div>

            <!-- Diagnostics Metrics -->
            <div class="card">
                <div class="card-title">Realtime Health</div>
                <div class="stats-grid">
                    <div class="stat-box">
                        <label>Super State</label>
                        <div id="val-state" class="stat-val" style="color: var(--accent-blue);">0</div>
                    </div>
                    <div class="stat-box">
                        <label>Speed (ERPM)</label>
                        <div id="val-rpm" class="stat-val">0</div>
                    </div>
                    <div class="stat-box">
                        <label>V_Bus Avg</label>
                        <div id="val-vbus" class="stat-val">0.0V</div>
                    </div>
                    <div class="stat-box">
                        <label>Packet Loss</label>
                        <div id="val-loss" class="stat-val" style="color: var(--accent-green);">0.0%</div>
                    </div>
                </div>
            </div>

            <!-- File Storage -->
            <div class="card">
                <div class="card-title">File Operations</div>
                <button id="btn-save" style="background-color: var(--accent-green);">Export CSV Log</button>
                <div style="margin-top: 10px;">
                    <label>Load Log File</label>
                    <input type="file" id="file-load" accept=".json,.csv">
                </div>
            </div>

        </div>

        <!-- CANVAS PLOTTER -->
        <div class="plot-container">
            <div class="card-title" style="margin-bottom: 10px;">High-Fidelity Telemetry Canvas</div>
            <div class="canvas-wrapper">
                <canvas id="telemetryCanvas"></canvas>
            </div>
            <div class="plot-selectors" id="plot-selectors-container">
                <!-- Variables will be dynamically injected here with color markers -->
            </div>
        </div>

        <!-- INTERACTIVE TERMINAL -->
        <div class="terminal-container">
            <div class="card-title">Interactive VESC Command Terminal</div>
            <div class="console-out" id="console-display">--- Command Terminal Log Offline ---</div>
            <div class="console-input-row">
                <input type="text" id="terminal-input" placeholder="Type firmware command (e.g., wrsm_stream on)..." disabled>
                <button id="btn-send" disabled>Send</button>
            </div>
        </div>

    </div>

    <script>
        // --- 1. CONFIGURATION & TELEMETRY DEFINITION ---
        const PACKET_SIZE = 89;
        const START_MARKER = 0xAA;

        // Strict ordering matches the compiler alignment definition inside wrsm_supervisor.c
        const TELEMETRY_LAYOUT = [
            { name: "rpm", label: "Speed (ERPM)", color: "#3b82f6", active: true },
            { name: "accel_avg", label: "Accel (Avg)", color: "#10b981", active: true },
            { name: "accel_mad", label: "Accel (MAD)", color: "#f59e0b", active: false },
            { name: "iq_avg", label: "Iq (Avg)", color: "#ec4899", active: false },
            { name: "iq_mad", label: "Iq (MAD)", color: "#8b5cf6", active: false },
            { name: "iq_target", label: "Iq Target", color: "#64748b", active: false },
            { name: "id_avg", label: "Id (Avg)", color: "#06b6d4", active: false },
            { name: "id_min", label: "Id (Min)", color: "#0f766e", active: false },
            { name: "id_max", label: "Id (Max)", color: "#115e59", active: false },
            { name: "if_avg", label: "If Field (Avg)", color: "#eab308", active: true },
            { name: "if_mad", label: "If Field (MAD)", color: "#ca8a04", active: false },
            { name: "field_pwm_avg", label: "Field PWM (Avg)", color: "#f43f5e", active: false },
            { name: "field_pwm_mad", label: "Field PWM (MAD)", color: "#be123c", active: false },
            { name: "vbus_avg", label: "Vbus (Avg)", color: "#a855f7", active: false },
            { name: "vbus_min", label: "Vbus (Min)", color: "#701a75", active: false },
            { name: "vbus_max", label: "Vbus (Max)", color: "#fae8ff", active: false },
            { name: "duty_avg", label: "FOC Duty (Avg)", color: "#22c55e", active: false },
            { name: "duty_max", label: "FOC Duty (Max)", color: "#14532d", active: false },
            { name: "if_min", label: "If Field (Min)", color: "#fdba74", active: false },
            { name: "stator_fw_id", label: "Stator FW Id", color: "#93c5fd", active: false }
        ];

        // --- 2. GLOBAL STATE ---
        let port = null;
        let reader = null;
        let writer = null;
        let rxBuffer = new Uint8Array(0);
        let telemetryData = [];  // Array storing all parsed packet samples
        
        // Sequence tracking
        let lastPacketId = null;
        let totalLostPackets = 0;
        let totalReceivedPackets = 0;

        // UI Binding Cached Handles
        const btnConnect = document.getElementById('btn-connect');
        const termInput = document.getElementById('terminal-input');
        const btnSend = document.getElementById('btn-send');
        const consoleDisplay = document.getElementById('console-display');
        const streamIndicator = document.getElementById('stream-indicator');
        const canvas = document.getElementById('telemetryCanvas');
        const ctx = canvas.getContext('2d');

        // --- 3. UI GENERATION ---
        function initToggles() {
            const container = document.getElementById('plot-selectors-container');
            TELEMETRY_LAYOUT.forEach((v, index) => {
                const tag = document.createElement('label');
                tag.className = "selector-tag";
                tag.style.color = v.color;
                
                const checkbox = document.createElement('input');
                checkbox.type = "checkbox";
                checkbox.checked = v.active;
                checkbox.addEventListener('change', (e) => {
                    v.active = e.target.checked;
                });

                tag.appendChild(checkbox);
                tag.appendChild(document.createTextNode(v.label));
                container.appendChild(tag);
            });
        }
        initToggles();

        // --- 4. SERIAL COMM ENGINE ---
        btnConnect.addEventListener('click', async () => {
            if (port) {
                await disconnect();
            } else {
                await connect();
            }
        });

        async function connect() {
            try {
                port = await navigator.serial.requestPort();
                const baud = parseInt(document.getElementById('baudrate').value);
                await port.open({ baudRate: baud });

                btnConnect.innerText = "Disconnect Port";
                btnConnect.className = "disconnect";
                termInput.disabled = false;
                btnSend.disabled = false;
                consoleDisplay.innerText = "--- Console Connected. Streaming Active ---\n";
                streamIndicator.innerText = "● ONLINE";
                streamIndicator.style.color = "var(--accent-green)";

                // Spawn the read loop
                readLoop();
            } catch (err) {
                consoleDisplay.innerText += `\nError connecting: ${err.message}\n`;
                port = null;
            }
        }

        async function disconnect() {
            if (reader) {
                await reader.cancel();
            }
            if (port) {
                await port.close();
            }
            port = null;
            btnConnect.innerText = "Connect Port";
            btnConnect.className = "";
            termInput.disabled = true;
            btnSend.disabled = true;
            streamIndicator.innerText = "● IDLE";
            streamIndicator.style.color = "var(--text-muted)";
        }

        async function readLoop() {
            while (port && port.readable) {
                try {
                    reader = port.readable.getReader();
                    while (true) {
                        const { value, done } = await reader.read();
                        if (done) break;
                        
                        // Append newly arrived bytes directly to the circular stream buffer
                        let newBuf = new Uint8Array(rxBuffer.length + value.length);
                        newBuf.set(rxBuffer);
                        newBuf.set(value, rxBuffer.length);
                        rxBuffer = newBuf;

                        processBuffer();
                    }
                } catch (err) {
                    consoleDisplay.innerText += `\nRead error: ${err.message}\n`;
                    break;
                } finally {
                    if (reader) {
                        reader.releaseLock();
                    }
                }
            }
        }

        // --- 5. THE BINARY DE-MULTIPLEXING PARSER ---
        function processBuffer() {
            let i = 0;
            while (i < rxBuffer.length) {
                // Look for the 0xAA start byte
                if (rxBuffer[i] === START_MARKER) {
                    // Check if we have enough bytes remaining to verify the complete structural packet
                    if (i + PACKET_SIZE <= rxBuffer.length) {
                        const packetCandidate = rxBuffer.slice(i, i + PACKET_SIZE);
                        
                        // Validate XOR Checksum over first 88 bytes
                        let calcChecksum = 0;
                        for (let b = 0; b < PACKET_SIZE - 1; b++) {
                            calcChecksum ^= packetCandidate[b];
                        }
                        const rcvChecksum = packetCandidate[PACKET_SIZE - 1];

                        if (calcChecksum === rcvChecksum) {
                            // Extract valid packed sample
                            parseBinaryPacket(packetCandidate);
                            i += PACKET_SIZE;
                            continue;
                        }
                    } else {
                        // Not enough data yet to read the packet, wait for next incoming chunk
                        break;
                    }
                }

                // If it isn't a valid binary packet, decode the byte as plain ASCII terminal logging
                const charCode = rxBuffer[i];
                const char = String.fromCharCode(charCode);
                consoleDisplay.innerText += char;
                
                // Auto-scroll terminal console
                consoleDisplay.scrollTop = consoleDisplay.scrollHeight;
                i++;
            }
            
            // Clean processed bytes out of the buffer
            rxBuffer = rxBuffer.slice(i);
        }

        function parseBinaryPacket(bytes) {
            const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
            
            // Unpack 32-bit sequence ID
            const packetId = view.getUint32(1, true); // true = Little Endian
            const superState = view.getUint8(5);
            const mcState = view.getUint8(6);
            const ctrlMode = view.getUint8(7);

            // Frame Drop Sequence Monitoring
            totalReceivedPackets++;
            if (lastPacketId !== null) {
                const expectedId = (lastPacketId + 1) >>> 0; // unsigned 32-bit addition
                if (packetId !== expectedId && packetId > expectedId) {
                    const dropped = packetId - expectedId;
                    totalLostPackets += dropped;
                    document.getElementById('val-loss').style.color = "var(--accent-red)";
                }
            }
            lastPacketId = packetId;

            // Extract the 20 dynamic floats recursively matching our offset layout
            let offset = 8;
            const sample = {
                timestamp: Date.now(),
                packet_id: packetId,
                super_state: superState,
                mc_state: mcState,
                ctrl_mode: ctrlMode
            };

            TELEMETRY_LAYOUT.forEach(v => {
                sample[v.name] = view.getFloat32(offset, true);
                offset += 4;
            });

            // Commit structured sample to time-series database
            telemetryData.push(sample);

            // Update Sidebar values
            document.getElementById('val-state').innerText = superState;
            document.getElementById('val-rpm').innerText = Math.round(sample.rpm);
            document.getElementById('val-vbus').innerText = sample.vbus_avg.toFixed(1) + "V";
            
            const totalScheduled = totalReceivedPackets + totalLostPackets;
            const lossRate = (totalLostPackets / totalScheduled) * 100;
            document.getElementById('val-loss').innerText = lossRate.toFixed(1) + "%";

            // Draw to Canvas
            requestAnimationFrame(drawPlots);
        }

        // --- 6. COMMAND SENDER ---
        async function sendCommand(commandText) {
            if (!port || !port.writable) return;
            const encoder = new TextEncoder();
            const data = encoder.encode(commandText + "\n");
            
            const writer = port.writable.getWriter();
            await writer.write(data);
            writer.releaseLock();
        }

        btnSend.addEventListener('click', () => {
            const cmd = termInput.value;
            if (cmd.trim()) {
                sendCommand(cmd);
                termInput.value = "";
            }
        });

        termInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                btnSend.click();
            }
        });

        // --- 7. FAST 2D CANVAS SCROLLING PLOTTER ---
        function drawPlots() {
            if (telemetryData.length === 0) return;

            // Maintain canvas responsiveness matching page grid dimensions
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;

            const w = canvas.width;
            const h = canvas.height;

            ctx.clearRect(0, 0, w, h);

            // Draw baseline timing grids
            ctx.strokeStyle = "#1e293b";
            ctx.lineWidth = 1;
            for (let gridX = 0; gridX < w; gridX += w / 10) {
                ctx.beginPath();
                ctx.moveTo(gridX, 0);
                ctx.lineTo(gridX, h);
                ctx.stroke();
            }
            for (let gridY = 0; gridY < h; gridY += h / 6) {
                ctx.beginPath();
                ctx.moveTo(0, gridY);
                ctx.lineTo(w, gridY);
                ctx.stroke();
            }

            // Bound visible graphing window to last 300 processed telemetry points (scrolling time-axis)
            const maxPoints = 300;
            const sliceStart = Math.max(0, telemetryData.length - maxPoints);
            const activeSlice = telemetryData.slice(sliceStart);

            TELEMETRY_LAYOUT.forEach(v => {
                if (!v.active) return;

                // 1. Calculate adaptive dynamic scale bounds for this specific variable channel
                let minVal = Infinity;
                let maxVal = -Infinity;

                activeSlice.forEach(d => {
                    const val = d[v.name];
                    if (val < minVal) minVal = val;
                    if (val > maxVal) maxVal = val;
                });

                // Add minor scaling cushion to prevent line clipping
                const range = maxVal - minVal;
                minVal -= range * 0.05;
                maxVal += range * 0.05;
                if (Math.abs(range) < 0.001) {
                    minVal -= 1;
                    maxVal += 1;
                }

                // 2. Plot time-series line path
                ctx.beginPath();
                ctx.strokeStyle = v.color;
                ctx.lineWidth = 2;

                activeSlice.forEach((d, idx) => {
                    const x = (idx / (activeSlice.length - 1)) * w;
                    // Invert coordinates since canvas 0 is at top-left
                    const y = h - ((d[v.name] - minVal) / (maxVal - minVal)) * h;

                    if (idx === 0) {
                        ctx.moveTo(x, y);
                    } else {
                        ctx.lineTo(x, y);
                    }
                });
                ctx.stroke();

                // Draw variable min/max text labels on left side of plot
                ctx.fillStyle = v.color;
                ctx.font = "10px sans-serif";
                ctx.fillText(`${v.label} Max: ${maxVal.toFixed(1)}`, 10, 15 + TELEMETRY_LAYOUT.indexOf(v) * 12);
            });
        }

        // --- 8. CSV EXPORT UTILITY ---
        document.getElementById('btn-save').addEventListener('click', () => {
            if (telemetryData.length === 0) {
                alert("No telemetry samples captured yet.");
                return;
            }

            // Generate header columns
            let csv = "Timestamp,Packet_ID,Super_State,MC_State,Ctrl_Mode,";
            csv += TELEMETRY_LAYOUT.map(v => v.name).join(",") + "\n";

            // Append data rows
            telemetryData.forEach(d => {
                let row = `${d.timestamp},${d.packet_id},${d.super_state},${d.mc_state},${d.ctrl_mode},`;
                row += TELEMETRY_LAYOUT.map(v => d[v.name]).join(",");
                csv += row + "\n";
            });

            // Trigger local client-side download to computer
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `WRSM_Telemetry_${new Date().toISOString().replace(/[:.]/g, '-')}.csv`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        });

        // --- 9. LOCAL LOG LOAD UTILITY ---
        document.getElementById('file-load').addEventListener('change', (e) => {
            const files = e.target.files;
            if (!files || files.length === 0) return; // Verify a file was actually chosen
            const file = files[0]; // Extract the single File object from the FileList

            const reader = new FileReader();
            reader.onload = function(evt) {
                const text = evt.target.result;
                const lines = text.split("\n");
                if (lines.length < 2) return;

                // Match layout indices - Use lines[0] to grab the header string
                const headers = lines[0].trim().split(","); 
                const loadedSamples = [];

                for (let i = 1; i < lines.length; i++) {
                    const lineText = lines[i].trim();
                    if (!lineText) continue; // Skip trailing empty lines

                    const cols = lineText.split(",");
                    if (cols.length < headers.length) continue;

                    const sample = {
                        timestamp: parseInt(cols[0]),
                        packet_id: parseInt(cols[1]),
                        super_state: parseInt(cols[2]),
                        mc_state: parseInt(cols[3]),
                        ctrl_mode: parseInt(cols[4])
                    };

                    TELEMETRY_LAYOUT.forEach((v) => {
                        const csvColIndex = headers.indexOf(v.name);
                        if (csvColIndex !== -1) {
                            sample[v.name] = parseFloat(cols[csvColIndex]);
                        }
                    });

                    loadedSamples.push(sample);
                }

                telemetryData = loadedSamples;
                totalReceivedPackets = loadedSamples.length;
                totalLostPackets = 0;
                lastPacketId = null;
                document.getElementById('val-loss').innerText = "0.0%";
                
                consoleDisplay.innerText = `--- Loaded ${loadedSamples.length} telemetry samples from file ---\n`;
                requestAnimationFrame(drawPlots);
            };
            reader.readAsText(file);
        });
    </script>
</body>
</html>
